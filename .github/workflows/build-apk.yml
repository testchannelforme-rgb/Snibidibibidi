name: Build GridHQ APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # This step unzips your uploaded zip file.
      # It assumes the zip (e.g. MonopostoChampionshipManager_COMPLETE.zip)
      # is committed at the root of the repo. Adjust the filename below
      # to match exactly what you upload.
      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found at repo root. Skipping unzip (project may already be unzipped)."
          else
            echo "Unzipping $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle validates every gradle-wrapper.jar in the repo the
      # instant it runs — including this first call — so validation must
      # be disabled here too, before we ever get a chance to regenerate
      # the jar below. We replace it with a genuine one immediately after,
      # so disabling this check here is safe.
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Rebuild wrapper files
        working-directory: GridHQ
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x GridHQ/gradlew

      - name: Build debug APK
        working-directory: GridHQ
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridHQ-debug-apk
          path: GridHQ/app/build/outputs/apk/debug/*.apk
